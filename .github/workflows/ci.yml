name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_DB: mybestpicks
          POSTGRES_USER: mybestpicks
          POSTGRES_PASSWORD: password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U mybestpicks -d mybestpicks"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      DJANGO_SETTINGS_MODULE: mybestpicks.settings.dev
      SECRET_KEY: ci-only-not-a-secret
      DATABASE_URL: postgresql://mybestpicks:password@127.0.0.1:5432/mybestpicks
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: requirements/*.txt

      - name: Every requirement is pinned with ==
        run: |
          bad=$(grep -hvE '^\s*(#|$|-r |-c )' requirements/*.txt | grep -v '==' || true)
          if [ -n "$bad" ]; then echo "Unpinned requirements:"; echo "$bad"; exit 1; fi

      - name: Install dependencies
        run: pip install -r requirements/dev.txt -c requirements/constraints.txt

      - name: Ruff lint
        run: ruff check .

      - name: Ruff format
        run: ruff format --check .

      - name: Django system check
        run: python manage.py check

      - name: Migration check
        run: python manage.py makemigrations --check --dry-run

      - name: Deploy check (production settings)
        run: python manage.py check --deploy --fail-level WARNING
        env:
          DJANGO_SETTINGS_MODULE: mybestpicks.settings.production
          SECRET_KEY: ci-deploy-check-0123456789-abcdefghijklmnopqrstuvwxyz-ABCDEFGHIJKLMNOP
          ALLOWED_HOSTS: mybestpicks.in,www.mybestpicks.in
          CSRF_TRUSTED_ORIGINS: https://mybestpicks.in

      - name: Tests
        run: python manage.py test --noinput
