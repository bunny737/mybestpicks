{% load wagtailcore_tags %}
<section class="my-5" aria-label="{{ value.heading }}">
    <div class="d-flex align-items-center gap-2 mb-3">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"
            class="text-primary" aria-hidden="true">
            <circle cx="12" cy="12" r="10"></circle>
            <path d="M9.09 9a3 3 0 0 1 5.83 1c0 2-3 3-3 3"></path>
            <line x1="12" y1="17" x2="12.01" y2="17"></line>
        </svg>
        <h2 class="h4 fw-bold mb-0 text-dark">{{ value.heading }}</h2>
    </div>
    <div class="d-flex flex-column gap-3">
        {% for item in value.questions %}
        <div class="card p-3 p-md-4 border rounded-3 bg-light shadow-sm">
            <h3 class="h6 fw-bold text-dark mb-2">{{ item.question }}</h3>
            <div class="text-secondary small mb-0">{{ item.answer|richtext }}</div>
        </div>
        {% endfor %}
    </div>
</section>
