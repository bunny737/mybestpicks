{% extends "base.html" %}
{% load wagtailcore_tags layout_tags %}

{% block body_class %}template-standard{% endblock %}

{% block content %}
{% with is_non_content_page=True %}
<div class="container pt-4 pb-5">
    {% breadcrumbs %}
    <article class="prose mx-auto pt-2">
        <header class="mb-4 pb-3 border-bottom">
            <h1 class="display-6 fw-bold text-dark mb-0">{{ page.title }}</h1>
        </header>
        <div class="article-body">
            {{ page.body|richtext }}
        </div>
    </article>
</div>
{% endwith %}
{% endblock %}
