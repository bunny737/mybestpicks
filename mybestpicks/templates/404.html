{% extends "base.html" %}

{% block title %}Page not found{% endblock %}

{% block body_class %}template-404{% endblock %}

{% block content %}
<div class="container py-5 text-center">
    <div class="p-5 bg-light rounded-4 border shadow-sm mx-auto" style="max-width: 600px;">
        <span class="badge text-bg-warning text-dark px-3 py-2 rounded-pill fw-bold mb-3">404 Error</span>
        <h1 class="display-6 fw-bold text-dark mb-3">Page not found</h1>
        <p class="lead text-secondary mb-4">Sorry, we could not find that guide or page. It may have moved or been updated.</p>
        <p class="mb-0"><a class="btn btn-primary btn-lg fs-6 px-4" href="/">Go to the home page</a></p>
    </div>
</div>
{% endblock %}
