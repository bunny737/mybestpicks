{% load wagtailcore_tags %}{% if show %}
<nav aria-label="Breadcrumb" class="mb-3 py-1">
    <ol class="breadcrumb mb-0 small">
        <li class="breadcrumb-item"><a href="{% pageurl home %}" class="text-secondary text-decoration-none">Home</a></li>
        {% for ancestor in ancestors %}
        <li class="breadcrumb-item"><a href="{% pageurl ancestor %}" class="text-secondary text-decoration-none">{{ ancestor.title }}</a></li>
        {% endfor %}
        <li class="breadcrumb-item active text-dark fw-semibold" aria-current="page">{{ page.title }}</li>
    </ol>
</nav>
{% endif %}
