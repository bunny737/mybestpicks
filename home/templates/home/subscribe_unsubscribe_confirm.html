{% extends "base.html" %}

{% block title %}Unsubscribe{% endblock %}

{% block content %}
<div class="container pt-4 pb-5">
    <div class="prose mx-auto text-center">
        <h1 class="display-6 fw-bold text-dark mb-3">Unsubscribe {{ subscriber.email }}?</h1>
        <p class="text-secondary mb-4">
            You will stop receiving MyBestPicks emails, and we'll delete your email
            address.
        </p>
        <form method="post">
            {% csrf_token %}
            <button class="btn btn-danger" type="submit">Yes, unsubscribe me</button>
        </form>
    </div>
</div>
{% endblock %}
