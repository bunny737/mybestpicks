# TLS via Let's Encrypt (module 07; see docs/deployment.md). Apex is canonical:
# www redirects to the bare domain, and HTTP redirects to HTTPS. The ACME
# challenge location stays on port 80 (outside the redirect) so certbot's
# webroot renewal keeps working without editing this file again.
server {
    listen 80;
    server_name mybestpicks.in www.mybestpicks.in;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://mybestpicks.in$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name www.mybestpicks.in;

    ssl_certificate /etc/letsencrypt/live/mybestpicks.in/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/mybestpicks.in/privkey.pem;

    return 301 https://mybestpicks.in$request_uri;
}

server {
    listen 443 ssl;
    server_name mybestpicks.in;

    ssl_certificate /etc/letsencrypt/live/mybestpicks.in/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/mybestpicks.in/privkey.pem;

    client_max_body_size 20M;

    location /media/ {
        alias /app/media/;
    }

    location / {
        proxy_pass http://app:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }
}
